version: "3.9"

services:
  # ── Database ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: voxsales
      POSTGRES_PASSWORD: voxsales
      POSTGRES_DB: voxsales
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voxsales"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ─────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://voxsales:voxsales@postgres:5432/voxsales
      SYNC_DATABASE_URL: postgresql://voxsales:voxsales@postgres:5432/voxsales
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-secret-change-in-production
      FRONTEND_URL: http://localhost:5173
      # AI Voice & LLM Keys
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      TTS_PROVIDER: ${TTS_PROVIDER:-cartesia}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      # Telephony
      TELEPHONY_PROVIDER: ${TELEPHONY_PROVIDER:-twilio}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # ── Voice Agent ─────────────────────────────────────────────────────────────
  voice-agent:
    build:
      context: ./voice-agent
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-mistral-large-latest}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      STT_PROVIDER: ${STT_PROVIDER:-deepgram}
      TTS_PROVIDER: ${TTS_PROVIDER:-cartesia}
      CARTESIA_API_KEY: ${CARTESIA_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      BACKEND_URL: http://backend:8000
    depends_on:
      - backend
    command: python agent.py start
    profiles:
      - voice  # Only start with: docker-compose --profile voice up

  # ── n8n Workflow Automation ─────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: admin
      N8N_BASIC_AUTH_PASSWORD: changeme
      WEBHOOK_URL: http://localhost:5678
      GENERIC_TIMEZONE: Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n
    profiles:
      - automation  # Only start with: docker-compose --profile automation up

volumes:
  postgres_data:
  n8n_data:
